name: Build & release setup kit

# Tag pushes (v*) build the engine-only disc, package the setup kit, and attach
# it to a release -- creating the release if one does not exist yet. Manual runs
# do the same but upload the kit as a workflow artifact instead, so the
# packaging can be tested without cutting a release.
#
# This workflow never touches the game data. The disc it ships boots but has no
# resources in it; the end user runs update.bat, which downloads their own copy
# of the original files and folds them in. The complete disc is built only by
# full-image.yml, and only as a private artifact.
on:
  push:
    # Match both v-prefixed (v1.0.0) and bare semver (1.0.0) tags.
    tags: ['v*', '[0-9]*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create / upload to releases

env:
  DISC_NAME: Another World (USA)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with SaturnRingLib submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host tools
        # xorriso provides xorrisofs (ISO authoring) for the build, and plain
        # xorriso for the kit smoke test below. No ffmpeg/sox: this disc has no
        # CDDA audio track.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso wget unzip zip curl

      # Cache the fetched SH-2 gcc + iso2raw so we don't re-download ~hundreds
      # of MB every run. Keyed on the tool versions below.
      - name: Cache SaturnRingLib toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            SaturnRingLib/Compiler
            SaturnRingLib/tools/bin
          key: srl-toolchain-gcc14.2.0-iso2raw0.2.2

      - name: Fetch SH-2 toolchain + iso2raw
        # Only on a cache miss: the fetch scripts prompt interactively if their
        # target dirs already exist, which would hang CI.
        if: steps.toolchain.outputs.cache-hit != 'true'
        working-directory: SaturnRingLib
        run: |
          set -e
          bash tools/scripts/getcompiler.sh 14.2.0
          bash tools/scripts/getiso2raw.sh v0.2.2

      # Normally a no-op: OPENING.CPK is committed and so is the AVI it comes
      # from. It only re-encodes when the CPK is absent, because the encode
      # pushes a 690 MB capture through ffmpeg for an answer already in the tree,
      # and because mkopeningcpk.py's knobs are tuned against what shipped --
      # a silent re-encode is how the committed stream drifts from the tested one.
      # The movie is ours, unlike the bank files, so it does ship on this disc.
      - name: Encode the opening movie if it is missing
        run: |
          set -e
          if [ -f saturn/cd/data/OPENING.CPK ]; then
            echo "OPENING.CPK present -- using the committed encode."
          else
            echo "OPENING.CPK missing -- re-encoding from tools/assets/avi."
            sudo apt-get install -y -qq ffmpeg
            python3 tools/mkopeningcpk.py
          fi
          ls -la saturn/cd/data/OPENING.CPK

      # Deliberately WITHOUT running data.bat: saturn/cd/data must hold only the
      # CD skeleton so the shipped ISO carries no game resources.
      - name: Build engine-only Saturn disc (release)
        working-directory: saturn
        run: |
          set -e
          export SRL_INSTALL_ROOT=../SaturnRingLib
          bash ../SaturnRingLib/tools/scripts/make.sh release ../SaturnRingLib/Compiler
          ls -la BuildDrop

      - name: Assert the disc carries no game data
        run: |
          set -e
          # A leaked bank file would mean redistributing someone else's data.
          if ls saturn/cd/data/bank* saturn/cd/data/BANK* saturn/cd/data/memlist.bin 2>/dev/null | grep -q .; then
            echo "ERROR: game data present in the CD skeleton -- refusing to package"; exit 1
          fi
          xorriso -indev "saturn/BuildDrop/${DISC_NAME}.iso" -find / 2>/dev/null | tee /tmp/base-listing
          # `grep ... && { exit 1; }` would trip set -e on the *good* path, when
          # grep finds nothing and returns 1. Test it as a condition instead.
          if grep -qi 'BANK' /tmp/base-listing; then
            echo "ERROR: bank files inside the base ISO"; exit 1
          fi
          grep -q '0.BIN' /tmp/base-listing || { echo "ERROR: 0.BIN missing -- disc would not boot"; exit 1; }
          grep -q 'OPENING.CPK' /tmp/base-listing || { echo "ERROR: OPENING.CPK missing -- no title opening"; exit 1; }

      # The program on its own, for anyone embedding this game on a disc of
      # their own rather than burning ours -- a multi-game compilation loads
      # 0.bin over its own program and streams OPENING.CPK from the volume
      # root, and needs neither the ISO nor the kit around them.
      #
      # Staged after the assertion above on purpose: neither file is gated
      # data, but nothing publishable should be produced before the step that
      # proves no gated data is present.
      #
      # SHA256SUMS is the point of the whole step. `gh release upload
      # --clobber` below can replace an asset in place, so a tag alone is not
      # a reproducible pin; a consumer that records these digests can tell a
      # re-uploaded asset from the one it was built against.
      # data.bat and CONFIG.ME ride along because the program alone is not
      # playable: whoever embeds it still has to get the player's own DOS data
      # files onto the disc, and this is the script that does it. Shipping them
      # here means a consumer needs no checkout of this repository at all.
      # CONFIG.ME goes out with its own DATA_DIR untouched -- it points at this
      # project's CD skeleton, and a consumer must re-aim it at theirs.
      - name: Stage program files
        id: program
        run: |
          set -e
          PROG="$RUNNER_TEMP/program"
          mkdir -p "$PROG"
          cp saturn/cd/data/0.bin "$PROG/0.bin"
          cp saturn/cd/data/OPENING.CPK "$PROG/OPENING.CPK"
          cp tools/assets/data.bat "$PROG/data.bat"
          cp tools/assets/CONFIG.ME "$PROG/CONFIG.ME"
          (cd "$PROG" && sha256sum 0.bin OPENING.CPK data.bat CONFIG.ME > SHA256SUMS)
          cat "$PROG/SHA256SUMS"
          echo "dir=$PROG" >> "$GITHUB_OUTPUT"

      - name: Stage setup kit
        id: kit
        run: |
          set -e
          # Tag-driven runs use the tag as the release id; manual runs use the SHA.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VER="${GITHUB_REF_NAME}"; else VER="${GITHUB_SHA::7}"; fi

          STAGE="$RUNNER_TEMP/kit-stage"
          mkdir -p "$STAGE"

          # Base ISO, in the folder CONFIG.ME's BASE_ISO points at.
          mkdir -p "$STAGE/${DISC_NAME}"
          cp "saturn/BuildDrop/${DISC_NAME}.iso" "$STAGE/${DISC_NAME}/${DISC_NAME}.iso"

          # Scripts, shared libs and the bundled xorriso/iso2raw.
          cp -r tools/assets/bin tools/assets/lib "$STAGE/"
          cp tools/assets/data.bat tools/assets/update.bat "$STAGE/"
          cp tools/assets/README-kit.md "$STAGE/README.md"

          # In a source checkout DATA_DIR points back at the CD skeleton; in the
          # kit there is no checkout, so it becomes a local working dir.
          sed 's|^DATA_DIR=.*|DATA_DIR=./data|' tools/assets/CONFIG.ME > "$STAGE/CONFIG.ME"
          grep -q '^DATA_DIR=./data$' "$STAGE/CONFIG.ME"
          mkdir -p "$STAGE/data"

          chmod +x "$STAGE"/*.bat "$STAGE"/bin/lin/iso2raw "$STAGE"/bin/mac/*/iso2raw

          echo "ver=$VER"       >> "$GITHUB_OUTPUT"
          echo "stage_dir=$STAGE" >> "$GITHUB_OUTPUT"

      # Prove the kit actually works before shipping it, on a copy so the smoke
      # test's downloads and outputs never reach the zip. This is the only place
      # the Linux code path (system xorriso + bin/lin/iso2raw) gets exercised.
      - name: Smoke-test the kit
        run: |
          set -e
          TEST="$RUNNER_TEMP/kit-test"
          cp -r "${{ steps.kit.outputs.stage_dir }}" "$TEST"
          (cd "$TEST" && bash update.bat)
          out="$TEST/${DISC_NAME} - Complete"
          test -s "$out/${DISC_NAME}.bin"
          grep -q "FILE \"${DISC_NAME}.bin\" BINARY" "$out/${DISC_NAME}.cue"
          # De-raw the MODE1/2352 track back to an ISO and check the data landed
          # at the volume root under the names saturn_cdfile.cxx looks up.
          perl -e 'binmode STDIN; binmode STDOUT; while (read(STDIN,$s,2352)==2352) { print substr($s,16,2048) }' \
            < "$out/${DISC_NAME}.bin" > /tmp/deraw.iso
          xorriso -indev /tmp/deraw.iso -find / 2>/dev/null | tee /tmp/full-listing
          for f in BANK01 BANK0D MEMLIST.BIN 0.BIN OPENING.CPK; do
            grep -q "'/$f'" /tmp/full-listing || { echo "ERROR: /$f missing from the built disc"; exit 1; }
          done
          # IP.BIN is the SEGA boot header; without it byte-for-byte the disc
          # is a coaster, and xorriso rewrites that area unless we restore it.
          cmp -n 32768 "saturn/BuildDrop/${DISC_NAME}.iso" /tmp/deraw.iso
          echo "Kit smoke test passed."

      - name: Package setup kit
        id: package
        run: |
          set -e
          NAME="${DISC_NAME} - Setup Kit (${{ steps.kit.outputs.ver }})"
          # One zip, files at its root -- unzip yields update.bat directly, with
          # no wrapper folder to descend into.
          (cd "${{ steps.kit.outputs.stage_dir }}" && zip -rq "$RUNNER_TEMP/${NAME}.zip" .)
          echo "artifact_name=${NAME}"             >> "$GITHUB_OUTPUT"
          echo "zip_path=$RUNNER_TEMP/${NAME}.zip" >> "$GITHUB_OUTPUT"

      # Manual runs: surface the kit as a workflow artifact for inspection.
      - name: Upload kit as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.kit.outputs.stage_dir }}

      # Its own artifact rather than a folder inside the kit's: a consumer
      # after the program wants two files, not a disc image and a setup script
      # they have to dig past.
      - name: Upload program files as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DISC_NAME }} - Program Files (${{ steps.kit.outputs.ver }})
          path: ${{ steps.program.outputs.dir }}

      # Tag runs: attach to a release, creating it if missing.
      - name: Attach to GitHub release (tag runs)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # printf, not an indented multi-line literal: inside a YAML block
            # scalar every continuation line would carry its indentation into
            # the release notes.
            printf '%s\n' \
              "Automated Another World Saturn build from $TAG." \
              "" \
              "**To play:** download the Setup Kit zip, unzip it, and run \`update.bat\`" \
              "(double-click on Windows, or \`bash update.bat\`). It downloads the original" \
              "PC DOS data files and builds a burnable cue/bin. See README.md in the zip." \
              "" \
              "**To embed this game on your own disc:** \`0.bin\` is the program, linked at" \
              "0x06004000, and \`OPENING.CPK\` is the title movie it streams from the volume" \
              "root; \`data.bat\` and \`CONFIG.ME\` install the player's own DOS data files," \
              "and CONFIG.ME's DATA_DIR must be re-aimed at wherever your disc is authored" \
              "from. None of the four carries game data. Verify against \`SHA256SUMS\` rather" \
              "than trusting the tag -- release assets can be replaced in place." > /tmp/notes.md
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          fi
          gh release upload "$TAG" "${{ steps.package.outputs.zip_path }}" --clobber
          # Individually, not zipped: a consumer script fetches them by name
          # with one curl each and no unpacking step.
          gh release upload "$TAG" \
            "${{ steps.program.outputs.dir }}/0.bin" \
            "${{ steps.program.outputs.dir }}/OPENING.CPK" \
            "${{ steps.program.outputs.dir }}/data.bat" \
            "${{ steps.program.outputs.dir }}/CONFIG.ME" \
            "${{ steps.program.outputs.dir }}/SHA256SUMS" --clobber
